    <title>Banking Error - Critical Alert</title>
    <style>
        /* Windows 11 Modern Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #002050 0%, #001933 100%);
            color: #e5e5e5;
            text-align: center;
            overflow: hidden;
            height: 100vh;
        }

        .logo {
            margin: 20px auto;
            width: 80px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 128, 0.3));
        }

        .scan-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(32, 32, 32, 0.95);
            padding: 30px;
            border-radius: 8px;
            width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        .scan-title {
            font-size: 24px;
            font-weight: 600;
            color: #00ff88;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(0, 255, 128, 0.2);
        }

        .progress-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 25px 0;
            height: 24px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0078d4 0%, #00bcf2 100%);
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            animation: progressShine 2s infinite;
        }

        .scan-logs {
            margin-top: 25px;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: 'Consolas', monospace;
        }

        .critical-warning {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #8b0000 0%, #dc143c 100%);
            color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            width: 70%;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            box-shadow: 0 0 35px rgba(220, 20, 60, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            z-index: 9999;
            animation: alertPulse 1.5s infinite;
        }

        .toll-free-banner {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #dc143c 0%, #8b0000 100%);
            color: white;
            padding: 18px 35px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(220, 20, 60, 0.3);
            animation: bannerFloat 3s ease-in-out infinite, emergencyFlash 0.5s infinite alternate;
            z-index: 9999;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .warning-icon {
            width: 24px;
            vertical-align: middle;
            margin-right: 10px;
            animation: pulseWarning 0.8s infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes alertPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes bannerFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        @keyframes emergencyFlash {
            from { background: #ff0000; }
            to { background: #8b0000; }
        }

        @keyframes pulseWarning {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes flashText {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="alert-container">
        <div class="threat-header">
            <span class="status-flash">⚠ Critical Banking Error Detected</span>
        </div>
        
        <div class="scan-results">
            <div class="technical-code">[ERR] FIN:Banking.Theft.0xBADCODE</div>
            <div class="mitigation-protocol">Unauthorized Transaction Detected - Threat Level: 0xDEADBEEF</div>
        </div>

        <div style="margin-top: 25px; color: #ccc;">
            <div style="font-size: 0.9em;">Recommended Action Protocol:</div>
            <div class="technical-code" style="margin: 10px 0;">
                > invoke FinancialResponse --severity=CRITICAL --vector=BANKING
            </div>
            <div style="color: white;">
                Immediate Account Freeze Required (ASIMOV Protocol Violation)
            </div>
        </div>
    </div>

    <script>
        // Fullscreen Lock Logic
        function enforceFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            }
        }

        // Block exit attempts
        document.addEventListener('fullscreenchange', enforceFullscreen);
        document.addEventListener('webkitfullscreenchange', enforceFullscreen);
        document.addEventListener('mozfullscreenchange', enforceFullscreen);
        document.addEventListener('MSFullscreenChange', enforceFullscreen);

        // Block keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'F11' || (e.ctrlKey && e.key === 'F4')) {
                e.preventDefault();
                enforceFullscreen();
            }
        });

        // Start in fullscreen mode
        enforceFullscreen();
    </script>
